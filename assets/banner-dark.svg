<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Oleg Karnaukhov — Frontend / Full-stack developer">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c1a"/>
      <stop offset="55%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#1a1614"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#ff7236" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff7236" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7236"/>
      <stop offset="100%" stop-color="#d13a0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4f1e9" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#ink)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>

    <!-- keycap cluster -->
    <g transform="translate(944 96)">
      <g fill="#000" fill-opacity="0.35">
        <rect x="0" y="8" width="80" height="80" rx="16"/>
        <rect x="92" y="8" width="80" height="80" rx="16"/>
        <rect x="184" y="8" width="80" height="80" rx="16"/>
        <rect x="0" y="100" width="80" height="80" rx="16"/>
        <rect x="92" y="100" width="80" height="80" rx="16"/>
        <rect x="184" y="100" width="80" height="80" rx="16"/>
      </g>
      <g fill="#232320" stroke="#f4f1e9" stroke-opacity="0.12">
        <rect x="0" y="0" width="80" height="80" rx="16"/>
        <rect x="184" y="0" width="80" height="80" rx="16"/>
        <rect x="0" y="92" width="80" height="80" rx="16"/>
        <rect x="92" y="92" width="80" height="80" rx="16"/>
        <rect x="184" y="92" width="80" height="80" rx="16"/>
      </g>
      <rect x="92" y="0" width="80" height="80" rx="16" fill="url(#accentKey)"/>
      <g font-family="Menlo, Consolas, monospace" font-size="24" fill="#f4f1e9" fill-opacity="0.34" text-anchor="middle">
        <text x="40" y="48">&lt;</text>
        <text x="224" y="48">&gt;</text>
        <text x="40" y="140">{</text>
        <text x="132" y="140">/</text>
        <text x="224" y="140">}</text>
      </g>
      <path d="M120 52 148 24M128 24h20v20" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- copy -->
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="72" y="120" font-size="14" letter-spacing="4.4" fill="#f4f1e9" fill-opacity="0.5">CREATIVE DEVELOPMENT</text>
      <text x="72" y="196" font-size="66" font-weight="700" letter-spacing="-1.5" fill="#f4f1e9">allgenl<tspan fill="#ff5a1f">.</tspan></text>
      <text x="72" y="238" font-size="24" fill="#f4f1e9" fill-opacity="0.78">Oleg Karnaukhov — Frontend / Full-stack developer</text>

      <g font-size="14" letter-spacing="0.6">
        <g fill="none" stroke="#f4f1e9" stroke-opacity="0.18">
          <rect x="72" y="268" width="96" height="34" rx="17"/>
          <rect x="178" y="268" width="106" height="34" rx="17"/>
          <rect x="294" y="268" width="126" height="34" rx="17"/>
          <rect x="430" y="268" width="92" height="34" rx="17"/>
        </g>
        <g fill="#f4f1e9" fill-opacity="0.68" text-anchor="middle">
          <text x="120" y="290">React</text>
          <text x="231" y="290">Next.js</text>
          <text x="357" y="290">TypeScript</text>
          <text x="476" y="290">WebGL</text>
        </g>
      </g>
    </g>

    <rect x="0" y="0" width="6" height="360" fill="#ff5a1f"/>
  </g>
</svg>
